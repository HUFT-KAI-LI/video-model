# Controlled R0 pair: same target/history/noise, equal K; no gate-label penalty.
seed: 42
data:
  train_manifest: data/reality_train.jsonl
  val_manifest: data/reality_val.jsonl
  frames: 57
  fps: 16
  height: 256
  width: 432
  workers: 4
  # Manifest construction RNG, separate from the training/probing seed.
  selection_seed: 42
  # Offline manifests filter with the full target histogram (first frame at/after
  # each timestamp); strict-online would require causal_previous instead.
  temporal_sampling: first_at_or_after
model:
  upstream_config: code/LongLive/configs/longlive_inference.yaml
  wan: models/Wan2.1-T2V-1.3B
  longlive: models/LongLive-1.3B
reality_memory:
  stage: r0
  encoder:
    type: dinov2
    path: models/dinov2-small
    feature_dim: 384
    image_size: 224
    frozen: true
  feature_cache: data/reality_features
  references:
    selection_protocol: offline_target_filtered
    global_constant_features: data/reality_global_mean_features.pt
    # Explicit pool size (no longer inferred from the evaluation sweep).
    pool_size: 8
    # The committed offline manifest predates the selection identity fields.
    # New strict-online experiments must rebuild the manifest instead.
    allow_legacy_offline_manifest: true
    min_count: 1
    max_count: 4
    async_probability: 0.5
    aligned_probability: 0.2
    no_memory_probability: 0.15
    wrong_memory_probability: 0.15
    per_reference_dropout: 0.0
    min_gap_sec: 1.5
    async_direction: past_only
    near_radius_sec: 0.5
    boundary_margin_sec: 0.2
  filter:
    histogram_cut: 0.5
    pixel_jump: 0.35
    black_level: 16
    black_fraction: 0.95
    scene_similarity: 0.65
    workers: 8
  projector:
    num_memory_tokens: 8
    memory_dim: 256
  guidance:
    mode: context
    context_dim: 4096
    heads: 4
    gate_init_logit: -2.0
    zero_init: true
  regularization:
    delta_weight: 1.0e-05
    wrong_gate_weight: 0.0
  objective:
    prefix_latents: 6
    future_blocks: 1
    paired:
      correct_kind: async
      reference_count: 2
      contrast_weight: 0.01
      temperature: 0.1
      degradation:
        mode: mild
        sigma: 0.05
        protected_prefix: 3
      # Decomposed video/contrast gradient norms are logged on updates 1, 2 and
      # every diagnostic_interval updates (1,2,5,10,...); disable for
      # long/four-card runs.
      diagnostic_gradients: true
      diagnostic_interval: 5
      probe_noise_seeds:
      - 50000
      - 60000
train:
  backbone_frozen: true
  max_steps: 100
  lr: 0.0001
  weight_decay: 0.01
  warmup_steps: 10
  save_every: 10
  eval_every: 50
  grad_clip: 1.0
  world_size: 1
  max_updates: 50
eval:
  cases: 4
  reference_counts:
  - 0
  - 1
  - 2
  - 4
  - 8
