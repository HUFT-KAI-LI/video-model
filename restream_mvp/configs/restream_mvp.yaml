seed: 42
data:
  train_manifest: data/train.jsonl
  val_manifest: data/val.jsonl
  frames: 57
  height: 256
  width: 432
  workers: 4
model:
  upstream_config: code/LongLive/configs/longlive_inference.yaml
  wan: models/Wan2.1-T2V-1.3B
  longlive: models/LongLive-1.3B
reanchor:
  channels: 16
  gate_init_logit: -2.0
  drift_probability: 0.8
  delta_regularization: 0.0001
train:
  max_steps: 3000
  lr: 0.0001
  weight_decay: 0.01
  warmup_steps: 100
  save_every: 500
  eval_every: 500
  grad_clip: 1.0
  world_size: 4
eval:
  cases: 8
